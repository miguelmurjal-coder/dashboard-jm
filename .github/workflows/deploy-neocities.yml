name: Publicar no Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-neocities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o dashboard
        uses: actions/checkout@v4

      - name: Preparar apenas os ficheiros públicos
        shell: bash
        run: |
          mkdir -p neocities-dist
          cp index.html neocities-dist/index.html
          cp logo-pke-automotive.png neocities-dist/logo-pke-automotive.png
          cp pke-login-mclaren-720s.png neocities-dist/pke-login-mclaren-720s.png

      - name: Publicar no Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          preview_before_deploy: true
          dist_dir: neocities-dist
